title: Xingyu Miao
description: Research in embodied AI, world models, and robot learning.
url: https://xingy038.github.io
baseurl: ""
locale: en-US
timezone: Asia/Shanghai
markdown: kramdown
permalink: pretty
include:
  - _pages
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - scripts
  - local
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .github
